---
services:
  gluetun:
    image: 'qmcgaw/gluetun:latest'
    container_name: gluetun
    networks:
      - gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 7878:7878/tcp
      - 8080:8080/tcp
      - 8686:8686/tcp
      - 8787:8787/tcp
      - 9117:9117/tcp
      - 8090:8090/tcp
      - 5076:5076/tcp
      - 9696:9696/tcp
      - 6767:6767/tcp
      - 8989:8989/tcp
      - 9091:9091/tcp
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=Switzerland
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/portfwd
      - UPDATER_VPN_SERVICE_PROVIDER=private internet access
      - UPDATE_PERIOD=24h
      - BLOCK_MALICIOUS=on
      - BLOCK_SURVEILLANCE=on
      - BLOCK_ADS=on
      - HTTPPROXY=off
      - SHADOWSOCKS=off
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/gluetun:/gluetun'
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gluetun/ip"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  nzbhydra:
    image: 'lscr.io/linuxserver/nzbhydra2:latest'
    container_name: nzbhydra
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/nzbhydra:/config'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5076"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  jackett:
    image: 'lscr.io/linuxserver/jackett:latest'
    container_name: jackett
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/jackett:/config'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  prowlarr:
    image: 'lscr.io/linuxserver/prowlarr:latest'
    container_name: prowlarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/prowlarr:/config'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  sabnzbd:
    image: 'lscr.io/linuxserver/sabnzbd:latest'
    container_name: sabnzbd
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/sabnzbd:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  transmission:
    image: 'lscr.io/linuxserver/transmission:latest'
    container_name: transmission
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
      - FILE__PEERPORT=/volume1/dkrcfg/gluetun/portfwd
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/transmission:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u \"$$USER:$$PASS\" http://localhost:9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  sonarr:
    image: 'lscr.io/linuxserver/sonarr:latest'
    container_name: sonarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${TV_PATH:?Set TV_PATH in .env}:/tv'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/sonarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  radarr:
    image: 'lscr.io/linuxserver/radarr:latest'
    container_name: radarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/radarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  bazarr:
    image: 'lscr.io/linuxserver/bazarr:latest'
    container_name: bazarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${TV_PATH:?Set TV_PATH in .env}:/tv'
      - '${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/bazarr:/config'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  lidarr:
    image: 'lscr.io/linuxserver/lidarr:latest'
    container_name: lidarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${MUSIC_PATH:?Set MUSIC_PATH in .env}:/music'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/lidarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  mylar:
    image: 'lscr.io/linuxserver/mylar3:latest'
    container_name: mylar
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${COMICS_PATH:?Set COMICS_PATH in .env}:/comics'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/mylar:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  readarr:
    image: 'lscr.io/linuxserver/readarr:nightly-0.4.19.2811-ls400'
    container_name: readarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${BOOKS_PATH:?Set BOOKS_PATH in .env}:/books'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/readarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  recyclarr:
    image: 'lscr.io/linuxserver/recyclarr:latest'
    container_name: recyclarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/recyclarr:/config'
    restart: unless-stopped
  unpackerr:
    image: 'golift/unpackerr:latest'
    container_name: unpackerr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Australia/Sydney
      - UN_SONARR_0_URL=http://localhost:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://localhost:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_LIDARR_0_URL=http://localhost:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
      - UN_READARR_0_URL=http://localhost:8787
      - UN_READARR_0_API_KEY=${READARR_API_KEY}
    volumes:
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
networks:
  gluetun: null
