---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  gluetun:
    image: 'qmcgaw/gluetun:latest'
    container_name: gluetun
    networks:
      - gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 7878:7878/tcp
      - 8080:8080/tcp
      - 8686:8686/tcp
      - 8090:8090/tcp
      - 9696:9696/tcp
      - 6767:6767/tcp
      - 8989:8989/tcp
      - 8081:8081/tcp
      - 11011:11011/tcp
      - 5299:5299/tcp
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=Switzerland
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/portfwd
      # Pushes each new forwarded port into qBittorrent; requires "Bypass authentication
      # for clients on localhost" to be enabled in the qBittorrent Web UI.
      # Body is percent-encoded to avoid nested quoting inside the shell command.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -qO- --post-data=json=%7B%22listen_port%22%3A{{PORTS}}%7D http://127.0.0.1:8081/api/v2/app/setPreferences'
      - UPDATER_VPN_SERVICE_PROVIDER=private internet access
      - UPDATER_PERIOD=24h

      # DNS: simplify first
      - DNS_UPSTREAM_RESOLVER_TYPE=plain
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,1.0.0.1:53

      # Optional: make the startup healthcheck easier to pass while testing
      - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,cloudflare.com:443,github.com:443

      - BLOCK_MALICIOUS=on
      - BLOCK_SURVEILLANCE=on
      - BLOCK_ADS=on
      - HTTPPROXY=off
      - SHADOWSOCKS=off
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/gluetun:/gluetun'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
  flaresolverr:
    image: 'ghcr.io/flaresolverr/flaresolverr:latest'
    container_name: flaresolverr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Australia/Sydney}
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  prowlarr:
    image: 'lscr.io/linuxserver/prowlarr:latest'
    container_name: prowlarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/prowlarr:/config'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  sabnzbd:
    image: 'lscr.io/linuxserver/sabnzbd:latest'
    container_name: sabnzbd
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/sabnzbd:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  qbittorrent:
    image: 'lscr.io/linuxserver/qbittorrent:latest'
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
      - WEBUI_PORT=8081
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/qbittorrent:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  sonarr:
    image: 'lscr.io/linuxserver/sonarr:latest'
    container_name: sonarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${TV_PATH:?Set TV_PATH in .env}:/tv'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/sonarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  radarr:
    image: 'lscr.io/linuxserver/radarr:latest'
    container_name: radarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/radarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  bazarr:
    image: 'lscr.io/linuxserver/bazarr:latest'
    container_name: bazarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${TV_PATH:?Set TV_PATH in .env}:/tv'
      - '${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/bazarr:/config'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  lidarr:
    image: 'lscr.io/linuxserver/lidarr:latest'
    container_name: lidarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${MUSIC_PATH:?Set MUSIC_PATH in .env}:/music'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/lidarr:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  mylar:
    image: 'lscr.io/linuxserver/mylar3:latest'
    container_name: mylar
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${COMICS_PATH:?Set COMICS_PATH in .env}:/comics'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/mylar:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  lazylibrarian:
    image: 'lscr.io/linuxserver/lazylibrarian:latest'
    container_name: lazylibrarian
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
    volumes:
      - '${BOOKS_PATH:?Set BOOKS_PATH in .env}:/books'
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/lazylibrarian:/config'
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5299"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  recyclarr:
    image: 'ghcr.io/recyclarr/recyclarr:8'
    container_name: recyclarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
      - CRON_SCHEDULE=0 4 * * *
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/recyclarr:/config'
      - './config/recyclarr/configs:/config/configs:ro'
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  unpackerr:
    image: 'golift/unpackerr:latest'
    container_name: unpackerr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
      - UN_SONARR_0_URL=http://localhost:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://localhost:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_LIDARR_0_URL=http://localhost:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
    volumes:
      - '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep unpackerr > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  cleanuparr:
    image: 'ghcr.io/cleanuparr/cleanuparr:latest'
    container_name: cleanuparr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - PUID=1027
      - PGID=100
      - TZ=${TZ:-Australia/Sydney}
      - PORT=11011
    volumes:
      - '${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/cleanuparr:/config'
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  gluetun: null
