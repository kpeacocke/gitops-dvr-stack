# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
---
# One instance per Arr server; both HD and UHD profiles share this endpoint.
# Reject DV without HDR fallback while preserving existing guide policies.
sonarr:
  sonarr:
    base_url: http://localhost:8989
    api_key: !env_var 'SONARR_API_KEY'
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca
        assign_scores_to:
          - name: WEB-1080p
            score: -10000
          - name: WEB-2160p
            score: -10000
    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4
        - trash_id: 85fae4a2294965b75710ef2989c850eb
        - trash_id: 59c3af66780d08332fdc64e68297098f
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c
